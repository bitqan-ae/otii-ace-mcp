#
# Runs the pytest suite and the otii-usb command against the simulator on
# Python 3.12, 3.13 and 3.14 (SW-018). No hardware is involved.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test
        run: python -m pytest

      - name: CLI smoke test (simulator)
        run: |
          otii-usb --simulate --json status
          otii-usb --simulate --json measure --time 0.05
          otii-usb --simulate --json record --time 0.2 --csv smoke.csv --png smoke.png
