  <text x="30.0" y="40.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#111827" font-weight="700" text-anchor="start">Property ids</text>
  <text x="30.0" y="63.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">A property id is a base id (bits 0–9) plus an attribute selector (bits 10–13) that picks the value, a limit, or the float form.</text>
