<svg xmlns="http://www.w3.org/2000/svg" width="900" height="772" viewBox="0 0 900 772">
  <title>A measurement session, as captured</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs>
  <rect width="900" height="772" rx="14" fill="#ffffff"/>
  <text x="30.0" y="40.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#111827" font-weight="700" text-anchor="start">A measurement session</text>
  <text x="30.0" y="63.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">Requests (→) are answered by responses with the same transaction id; data and updates (←) arrive unsolicited.</text>
  <rect x="140.0" y="96.0" width="140.0" height="34.0" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.0"/>
  <text x="210.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">host (otii-usb)</text>
  <rect x="620.0" y="96.0" width="140.0" height="34.0" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.0"/>
  <text x="690.0" y="118.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">Otii Ace Pro</text>
  <line x1="210.0" y1="154.0" x2="682.0" y2="154.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">HELLO  txn 1</text>
  <line x1="690.0" y1="188.0" x2="218.0" y2="188.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="182.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">protocol 3 · max payload 32800 · &quot;Ace &quot; · 0x3f</text>
  <line x1="210.0" y1="222.0" x2="682.0" y2="222.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="216.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">GET_PROPERTY fwversion (0x81)  txn 2</text>
  <line x1="690.0" y1="256.0" x2="218.0" y2="256.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">&quot;3.2.5&quot;</text>
  <line x1="210.0" y1="290.0" x2="682.0" y2="290.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="284.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">GET_PROPERTY chinfo (0x8d)  txn 4</text>
  <line x1="690.0" y1="324.0" x2="218.0" y2="324.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="318.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">18 channel records × 16 bytes</text>
  <line x1="210.0" y1="358.0" x2="682.0" y2="358.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="352.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">SET_CHANNEL mv / mc / mp on  txn 5–7</text>
  <line x1="690.0" y1="392.0" x2="218.0" y2="392.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="386.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ok × 3</text>
  <line x1="210.0" y1="426.0" x2="682.0" y2="426.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="420.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">RECORD_START  txn 8</text>
  <line x1="690.0" y1="460.0" x2="218.0" y2="460.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="454.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ok</text>
  <line x1="690.0" y1="494.0" x2="218.0" y2="494.0" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="450.0" y="488.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b45309" font-weight="600" text-anchor="middle">DATA  seq 0, 1, 2, …  one packet per millisecond</text>
  <line x1="210.0" y1="528.0" x2="682.0" y2="528.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="522.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">PING (keepalive, every 0.5 s while streaming)</text>
  <line x1="690.0" y1="562.0" x2="218.0" y2="562.0" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="450.0" y="556.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151" font-weight="600" text-anchor="middle">PROPERTY_UPDATE (live values)</text>
  <line x1="210.0" y1="596.0" x2="682.0" y2="596.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="590.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">RECORD_STOP  txn 9</text>
  <line x1="690.0" y1="630.0" x2="218.0" y2="630.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="624.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ok</text>
  <line x1="210.0" y1="664.0" x2="682.0" y2="664.0" stroke="#0e7490" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="658.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0e7490" font-weight="600" text-anchor="middle">SET_CHANNEL mp / mc / mv off  txn 10–12</text>
  <line x1="690.0" y1="698.0" x2="218.0" y2="698.0" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450.0" y="692.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6d28d9" font-weight="600" text-anchor="middle">ok × 3</text>
  <line x1="210.0" y1="140.0" x2="210.0" y2="724.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="690.0" y1="140.0" x2="690.0" y2="724.0" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3 4"/>
  <text x="30.0" y="738.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">Solid: request/response. Dashed: unsolicited packets from the device.</text>
</svg>
