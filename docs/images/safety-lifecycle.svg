<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Safety lifecycle: identify, safe defaults, operate, safe shutdown</title>
  <rect x="0" y="0" width="900" height="430" rx="14" fill="#ffffff"/>
  <style>
    .t { font-size: 14px; font-weight: 600; fill: #111827; }
    .s { font-size: 12px; fill: #374151; }
    .m { font-size: 11.5px; fill: #6b7280; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; marker-end: url(#h); fill: none; }
    .warn { stroke: #f87171; stroke-width: 1.6; marker-end: url(#hr); fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker>
  </defs>

  <rect x="30" y="40" width="180" height="96" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text class="t" x="46" y="66">1 · Connect</text>
  <text class="s" x="46" y="88">handshake, read</text>
  <text class="s" x="46" y="105">type · protocol · firmware</text>
  <text class="m" x="46" y="124">REQ-SAFE-DEV-001</text>

  <rect x="250" y="40" width="190" height="96" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text class="t" x="266" y="66">2 · Safe defaults</text>
  <text class="s" x="266" y="88">main + expansion OFF</text>
  <text class="s" x="266" y="105">5 V · 500 mA, read back</text>
  <text class="m" x="266" y="118">REQ-SAFE-OUT-001</text>
  <text class="m" x="266" y="131">REQ-SAFE-DEV-002</text>

  <rect x="480" y="40" width="180" height="96" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="t" x="496" y="66">3 · Operate</text>
  <text class="s" x="496" y="88">tools / commands,</text>
  <text class="s" x="496" y="105">one call at a time</text>
  <text class="m" x="496" y="118">REQ-SAFE-DEV-003</text>
  <text class="m" x="496" y="131">REQ-SAFE-DEV-004</text>

  <rect x="700" y="40" width="170" height="96" rx="10" fill="#fef2f2" stroke="#f87171"/>
  <text class="t" x="716" y="66">Stop request</text>
  <text class="s" x="716" y="88">Ctrl-C · SIGTERM</text>
  <text class="s" x="716" y="105">SIGHUP · disconnect</text>
  <text class="m" x="716" y="118">REQ-SAFE-OUT-002</text>
  <text class="m" x="716" y="131">REQ-SAFE-OUT-007</text>

  <rect x="30" y="230" width="190" height="96" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text class="t" x="46" y="256">✖ Unsupported</text>
  <text class="s" x="46" y="278">refuse, exit 2</text>
  <text class="s" x="46" y="295">nothing written</text>
  <text class="m" x="46" y="314">REQ-SAFE-DEV-001</text>

  <rect x="480" y="230" width="190" height="96" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text class="t" x="496" y="256">4 · Cancel</text>
  <text class="s" x="496" y="278">running call aborts</text>
  <text class="s" x="496" y="295">within 50 ms, port freed</text>
  <text class="m" x="496" y="308">REQ-SAFE-OUT-004</text>
  <text class="m" x="496" y="321">REQ-SAFE-OUT-003</text>

  <rect x="700" y="230" width="170" height="96" rx="10" fill="#ecfdf5" stroke="#34d399"/>
  <text class="t" x="716" y="256">5 · Safe exit</text>
  <text class="s" x="716" y="278">stop recording</text>
  <text class="s" x="716" y="295">outputs OFF · defaults</text>
  <text class="m" x="716" y="308">REQ-SAFE-OUT-002</text>
  <text class="m" x="716" y="321">REQ-SAFE-DEV-005</text>

  <path class="arrow" d="M210 88 H248"/>
  <path class="arrow" d="M440 88 H478"/>
  <path class="warn" d="M660 88 H698"/>
  <path class="warn" d="M785 136 V180 H575 V228"/>
  <path class="arrow" d="M670 278 H698"/>
  <path class="arrow" d="M120 136 V228"/>
  <text class="m" x="128" y="190">not on the tested list</text>

  <text class="m" x="30" y="380">Further signals are ignored while steps 4–5 run, so a second Ctrl-C cannot leave the output on (REQ-SAFE-OUT-003).</text>
  <text class="m" x="30" y="400">The MCP server performs steps 4–5 on a dedicated thread, independent of the event loop and of stdin (DC-ARCH-RUN-002).</text>
</svg>
