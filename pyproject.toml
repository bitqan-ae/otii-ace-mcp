[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otii-usb"
version = "0.1.0"
description = "USB driver, interactive CLI and MCP server for the Qoitech Otii Ace Pro power analyzer"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "rich>=13.7",
    "prompt_toolkit>=3.0.40",
    "mcp>=2.3",
    "anyio>=4.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
otii-usb = "otii_usb.interfaces.cli:main"
otii-usb-mcp = "otii_usb.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otii_usb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
markers = ["hardware: needs an attached Otii Ace Pro; run with --hardware",
           "switches_output: powers the device under test; also needs --switch-output"]
